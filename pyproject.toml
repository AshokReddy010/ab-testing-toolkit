[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "abkit"
version = "1.1.0"
description = "Plan and analyse A/B tests: sample size, z and Welch tests, CUPED, SRM checks, corrections and a ship decision."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Ashok Reddy" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.0", "scipy>=1.11"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "matplotlib>=3.8", "tabulate>=0.9"]

[project.urls]
Homepage = "https://github.com/AshokReddy010/ab-testing-toolkit"
Playground = "https://ashokreddy010.github.io/ab-testing-toolkit/"

[tool.setuptools]
packages = ["abkit"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["playground/site"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["E501"]
